name: capacitagrd_app
description: App oficial CAPACITA-GRD - Ministerio de Vivienda, Construcción y Saneamiento
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Navigation
  go_router: ^14.2.7

  # HTTP & Network
  dio: ^5.7.0
  connectivity_plus: ^6.0.5

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Secure Storage
  flutter_secure_storage: ^9.2.2

  # DI
  get_it: ^8.0.2

  # Auth / Biometrics
  local_auth: ^2.3.0
  jwt_decoder: ^2.0.1

  # UI
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  animations: ^2.0.11
  badges: ^3.1.2
  percent_indicator: ^4.2.3
  intl: ^0.19.0

  # QR Scanner
  mobile_scanner: ^5.2.3

  # Geolocation
  geolocator: ^13.0.1
  geocoding: ^3.0.0

  # Maps
  google_maps_flutter: ^2.9.0
  flutter_polyline_points: ^2.1.0

  # PDF
  flutter_pdfview: ^1.3.2
  path_provider: ^2.1.4
  share_plus: ^10.0.2
  open_file: ^3.5.7

  # Camera / Files
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  permission_handler: ^11.3.1

  # Push Notifications
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3

  # Functional programming
  dartz: ^0.10.1

  # Utils
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.1
  device_info_plus: ^10.1.2
  uuid: ^4.5.1
  crypto: ^3.0.3
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
